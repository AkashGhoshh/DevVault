version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: devvault-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: devvault
      POSTGRES_USER: devvault
      POSTGRES_PASSWORD: devvault123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devvault -d devvault"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: devvault-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/devvault
      SPRING_DATASOURCE_USERNAME: devvault
      SPRING_DATASOURCE_PASSWORD: devvault123
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
