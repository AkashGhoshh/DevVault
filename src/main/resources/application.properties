server.port=8080
spring.application.name=ai-dump-yard

spring.datasource.url=jdbc:h2:file:./data/devvault;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=${DB_PASSWORD:devvault123}
# JPA & Hibernate (Auto-manage schema directly from Entities)
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# Production Polish
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
server.compression.min-response-size=1024

# Static Resource Cache Control (prevents stale client module caching)
spring.web.resources.cache.cachecontrol.no-cache=true
spring.web.resources.cache.cachecontrol.must-revalidate=true

# Concurrency & Virtual Threads (Java 21 Project Loom)
spring.threads.virtual.enabled=true
