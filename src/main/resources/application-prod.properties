# ===================================================================
# DevVault Production Profile (Active with SPRING_PROFILES_ACTIVE=prod)
# ===================================================================

# PostgreSQL Database Datasource
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/devvault}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:devvault}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:devvault123}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool Production Tuning
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=DevVaultHikariPool

# JPA / Hibernate in Production
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Disable H2 Console in Production
spring.h2.console.enabled=false
